version: '3.8'

services:
  backend:
    image: ${ECR_REPOSITORY_URL}:${IMAGE_TAG}
    container_name: uniroad-backend
    restart: always
    # 호스트의 네트워크를 공유하여 EC2에 설치된 Redis(localhost:6379)에 접근
    network_mode: host
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=localhost
      - REDIS_PORT=6379
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - APPLE_AUDIENCES=${APPLE_AUDIENCES}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      # S3는 EC2 인스턴스 역할로 접근한다. 액세스 키를 넘기면 S3Config가
      # 인스턴스 역할 대신 그 키를 우선 사용하므로 의도적으로 전달하지 않는다.
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - FIREBASE_ENABLED=${FIREBASE_ENABLED:-false}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_SERVICE_ACCOUNT_BASE64=${FIREBASE_SERVICE_ACCOUNT_BASE64:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"
