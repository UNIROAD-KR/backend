spring:
  main:
    allow-circular-references: true
  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  # 스키마 변경은 Flyway가 맡는다. 배포할 때 db/migration의 SQL을 순서대로 적용하므로
  # 손으로 ALTER를 돌리는 단계가 없다.
  #
  # ddl-auto=update는 그대로 둔다. 지금까지 만들어진 테이블이 전부 update로 생긴 것이라
  # 곧바로 validate로 바꾸면 그동안 쌓인 차이 때문에 기동 자체가 막힌다.
  # 당분간 테이블·컬럼 "추가"는 update가, 이미 있는 것의 "변경"은 Flyway가 맡는다.
  # (update는 기존 컬럼의 타입·제약을 절대 바꾸지 않는다 — 이번 enum 사고가 그래서 났다.)
  flyway:
    enabled: true
    # 이미 테이블이 있는 DB라 첫 실행에서 히스토리가 없다.
    # 현재 스키마를 버전 1로 인정하고 그 뒤 버전부터 적용한다.
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
            client-name: Kakao
            provider: kakao

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
            client-name: Naver
            provider: naver

          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
cloud:
  aws:
    # 액세스 키를 비워두면 EC2 인스턴스 역할(IMDS)로 S3에 접근한다. S3Config 참고.
    credentials:
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
    region:
      static: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${S3_BUCKET:uniroad-image-bucket}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-seconds: 1800 # 30분
  refresh-token-validity-seconds: 1209600 # 14일

# ── 프론트엔드 URL ─────────────────────────────────────────────
frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

social:
  apple:
    audiences: ${APPLE_AUDIENCES:${APPLE_CLIENT_ID:}}

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  project-id: ${FIREBASE_PROJECT_ID:}
  service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}
