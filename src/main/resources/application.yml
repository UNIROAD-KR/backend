spring:
  application:
    name: backend
  profiles:
    # Dockerfile은 prod 프로필을 명시하므로, IDE/gradlew로 실행할 때만 local이 사용됩니다.
    active: local
  output:
    ansi:
      enabled: DETECT

logging:
  level:
    root: INFO
    org.springframework: WARN
    org.apache: WARN
    org.hibernate: DEBUG
    org.springframework.security: DEBUG

firebase:
  enabled: false
