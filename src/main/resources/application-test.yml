# 테스트 전용 설정. 이 파일은 저장소에 커밋되므로 실제 자격 증명을 절대 넣지 않는다.
#
# 예전에는 카카오·네이버 client-secret이 기본값으로 박혀 있었다. ${ENV:기본값} 문법의
# 기본값은 환경변수가 없을 때 그대로 쓰이는 "진짜 값"이라 사실상 평문 커밋이었다.
# 소셜 클라이언트 등록은 테스트에 필요 없어서(SecurityConfig가 등록 없이도 기동한다)
# 블록째 지웠다. 값이 필요해지면 더미 문자열을 쓰고 실제 값은 환경변수로만 주입한다.
#
# 아래 jwt.secret은 서명 검증용 더미 키다. 운영 키는 application-prod.yml의 환경변수로만 온다.
spring:
  # 테스트는 H2 create-drop으로 매번 새 스키마를 만든다. 마이그레이션을 돌릴 대상이 없다.
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect


jwt:
  secret: ZGV2LWdyZWVucGF0aC1zZWNyZXQta2V5LW11c3QtYmUtYXQtbGVhc3QtMjU2Yml0cw==
  access-token-validity-seconds: 1800 # 30분
  refresh-token-validity-seconds: 1209600 # 14일

frontend:
  url: http://localhost:3000

cors:
  allowed-origins: http://localhost:3000


springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

cloud:
  aws:
    region:
      static: ap-northeast-2
    s3:
      bucket: uniroad-image-bucket
    credentials:
      access-key: dummy-access-key
      secret-key: dummy-secret-key
